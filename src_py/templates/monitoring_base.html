<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FINRES - Model Governance & Operations{% endblock %}</title>
    <!-- Enterprise Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #f8fafc;
            --bg-surface: #ffffff;
            --bg-surface-subtle: #f1f5f9;
            --bg-dark-nav: #0f172a;
            --border-subtle: #e2e8f0;
            --border-medium: #cbd5e1;
            
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-muted: #64748b;
            
            --brand-primary: #0f172a;
            --brand-accent: #2563eb;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            font-size: 0.875rem;
            line-height: 1.5;
        }

        .code-num, .version-badge, .audit-row {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8125rem;
        }

        .top-navbar-mon {
            background-color: var(--bg-dark-nav);
            border-bottom: 1px solid #1e293b;
            padding: 0.625rem 1.25rem;
        }

        .brand-logo-mon {
            font-weight: 700;
            font-size: 1.05rem;
            color: #ffffff !important;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-link-custom {
            color: #94a3b8 !important;
            font-size: 0.8125rem;
            font-weight: 500;
            padding: 0.4rem 0.75rem !important;
            border-radius: 5px;
            transition: all 0.15s ease;
        }

        .nav-link-custom:hover {
            color: #f8fafc !important;
            background-color: rgba(255, 255, 255, 0.06);
        }

        .nav-link-custom.active {
            color: #ffffff !important;
            background-color: rgba(255, 255, 255, 0.12);
            font-weight: 600;
        }

        .card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.04);
            margin-bottom: 1.25rem;
        }

        .card-header {
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-subtle);
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--text-secondary);
            padding: 0.75rem 1rem;
        }

        .kpi-panel {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            padding: 1rem;
            height: 100%;
        }

        .kpi-label {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.03em;
            margin-bottom: 0.25rem;
        }

        .kpi-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .table thead th {
            background-color: var(--bg-surface-subtle);
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.6875rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            border-bottom: 1px solid var(--border-medium);
            padding: 0.625rem 0.875rem;
        }

        .table tbody td {
            padding: 0.75rem 0.875rem;
            vertical-align: middle;
            border-bottom: 1px solid var(--border-subtle);
        }
    </style>
</head>
<body>
    <header class="top-navbar-mon">
        <div class="container-fluid d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
                <a class="brand-logo-mon text-decoration-none" href="{{ url_for('monitoring_dashboard') }}">
                    <i class="bi bi-cpu text-info"></i>
                    FINRES Governance & Observability
                </a>
                <span class="badge bg-secondary text-light">Admin Controls</span>
            </div>

            <nav class="d-flex align-items-center gap-1">
                <a class="nav-link-custom {% if request.path == '/monitoring' or request.path == '/monitoring/dashboard' %}active{% endif %}" href="{{ url_for('monitoring_dashboard') }}">
                    <i class="bi bi-speedometer2 me-1"></i> Observability
                </a>
                <a class="nav-link-custom {% if request.path.startswith('/monitoring/models') %}active{% endif %}" href="{{ url_for('monitoring_models') }}">
                    <i class="bi bi-diagram-3 me-1"></i> Model Registry
                </a>
                <a class="nav-link-custom {% if request.path.startswith('/monitoring/rules') %}active{% endif %}" href="{{ url_for('monitoring_rules') }}">
                    <i class="bi bi-sliders me-1"></i> Policy Rules
                </a>
                <a class="nav-link-custom {% if request.path.startswith('/monitoring/audit') %}active{% endif %}" href="{{ url_for('monitoring_audit') }}">
                    <i class="bi bi-journal-text me-1"></i> Audit Trail
                </a>
            </nav>

            <div class="d-flex align-items-center gap-2">
                <span class="badge bg-success text-light px-2 py-1"><i class="bi bi-check-circle me-1"></i> System Healthy</span>
                <a class="btn btn-sm btn-outline-light" href="{{ url_for('dashboard') }}" style="font-size: 0.75rem;">
                    <i class="bi bi-arrow-left me-1"></i> Return to Underwriting
                </a>
            </div>
        </div>
    </header>

    <main class="container-fluid py-3 px-4">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
        if (window.Chart) {
            Chart.defaults.font.family = "'Inter', sans-serif";
            Chart.defaults.font.size = 11;
            Chart.defaults.color = '#64748b';
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
